name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target each other's branches, not just main.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: teams-assignments-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
